{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Email Verification - Jewelify</title><link rel="stylesheet" href="{% static 'assets/plugins/tabler-icons/tabler-icons.min.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
    <style>
      .success-icon {
        width: 30px;
        height: 30px;
        background-color: #20b45b;
        color: white;
        border-radius: 50%;
        margin: 0 auto 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
      }
      a{
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="auth-page auth-page-login">
      <form class="auth-card" action="#" method="post">
        <span class="success-icon">✓</span><header class="auth-header">
          <h1>Email Sent</h1><p>Check your email & change your password.</p>
        </header>
        {% csrf_token %}
        <button class="primary-button" type="submit">
            <a href="{% url 'reset-password' %}">Reset Password</a>
        </button>
      </form>
      <p class="copyright">Copyright &copy; 2026 - Jewelify.</p>
    </main>
  </body>
</html>
